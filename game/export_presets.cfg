vram_texture_compression/for_mobile=false
html/export_icon=true
html/head_include="<script src=\"https://sdk.crazygames.com/crazygames-sdk-v3.js\"></script>
<script>
window.MPCG = {ready: false, failed: false, muted: false, env: \"none\", inAd: false};
(function () {
  var M = window.MPCG;
  var S = window.CrazyGames && window.CrazyGames.SDK;
  M.gameplay = function (on) { try { on ? S.game.gameplayStart() : S.game.gameplayStop(); } catch (e) {} };
  M.happy = function () { try { S.game.happytime(); } catch (e) {} };
  M.loadingDone = function () { try { S.game.loadingStop(); } catch (e) {} };
  M.getItem = function (k) { try { return S.data.getItem(k); } catch (e) { return null; } };
  M.setItem = function (k, v) { try { S.data.setItem(k, v); } catch (e) {} };
  M.ad = function (type, cb) {
    var done = false;
    function end(ok) { if (!done) { done = true; M.inAd = false; cb(ok); } }
    try {
      S.ad.requestAd(type, {
        adStarted: function () { M.inAd = true; },
        adFinished: function () { end(true); },
        adError: function () { end(false); }
      });
    } catch (e) { end(false); }
  };
  if (!S) { M.failed = true; return; }
  S.init().then(function () {
    M.env = S.environment;
    try {
      M.muted = !!S.game.settings.muteAudio;
      S.game.addSettingsChangeListener(function (st) { M.muted = !!st.muteAudio; });
    } catch (e) {}
    try { S.game.loadingStart(); } catch (e) {}
    M.ready = true;
  }).catch(function () { M.failed = true; });
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

