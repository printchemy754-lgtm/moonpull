name: Build (APK + AAB + IPA + Web)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download Godot + export templates
        run: |
          set -e
          V="${GODOT_VERSION}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
          wget -q "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          mv "Godot_v${V}-stable_linux.x86_64" "$HOME/godot"
          chmod +x "$HOME/godot"
          wget -q "$BASE/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p /tmp/tpl "$HOME/.local/share/godot/export_templates/${V}.stable"
          unzip -q "Godot_v${V}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          rm -f ./*.zip ./*.tpz

      - name: Install Android build template into the project
        run: |
          set -e
          V="${GODOT_VERSION}"
          SRC="$HOME/.local/share/godot/export_templates/${V}.stable/android_source.zip"
          mkdir -p game/android/build
          unzip -q -o "$SRC" -d game/android/build
          echo "${V}.stable" > game/android/.build_version
          touch game/android/build/.gdignore
          # Google Play needs targetSdk 36 (from 31 Aug 2026). Godot 4.6 refuses 36 in the
          # export preset, so the preset keeps the default and we raise it here instead.
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$SDK/platforms/android-36" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" >/dev/null
          fi
          cat >> game/android/build/build.gradle <<'EOF'

          // --- Moonpull: target Android 16 (API 36) for Google Play ---
          android {
              compileSdk 36
              defaultConfig {
                  targetSdk 36
              }
          }
          EOF
          tail -n 8 game/android/build/build.gradle

      - name: Build the GodotAds plugin (AAR)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -e
          V="${GODOT_VERSION}"
          mkdir -p android-plugin/godotads/libs /tmp/godotlib
          AAR=$(find game/android/build -name 'godot-lib*release*.aar' | head -n1)
          if [ -z "$AAR" ]; then
            echo "godot-lib not in template, fetching from Maven Central"
            wget -q -O /tmp/godotlib/godot.aar "https://repo1.maven.org/maven2/org/godotengine/godot/${V}.stable/godot-${V}.stable.aar"
            AAR=/tmp/godotlib/godot.aar
          fi
          echo "Using $AAR"
          unzip -q -o "$AAR" classes.jar -d /tmp/godotlib
          cp /tmp/godotlib/classes.jar android-plugin/godotads/libs/godot-lib.jar
          if [ -n "$ADMOB_APP_ID" ]; then
            sed -i "s#ca-app-pub-[0-9]*~[0-9]*#${ADMOB_APP_ID}#" android-plugin/godotads/src/main/AndroidManifest.xml
            echo "Using AdMob App ID from the ADMOB_APP_ID secret"
          fi
          if grep -q "USE_TEST_ADS := true" game/scripts/ads.gd; then
            echo "::notice::Built with TEST ads. Set USE_TEST_ADS := false in game/scripts/ads.gd for the Google Play release."
          else
            echo "::notice::Built with REAL ads."
          fi
          (cd android-plugin && gradle --no-daemon :godotads:assembleRelease)
          mkdir -p game/addons/godot_ads/bin
          cp android-plugin/godotads/build/outputs/aar/godotads-release.aar game/addons/godot_ads/bin/GodotAds-release.aar

      - name: Configure signing + editor settings
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          V="${GODOT_VERSION}"
          MM="${V%.*}"   # e.g. 4.6
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$HOME/.config/godot"
          for f in "editor_settings-${MM}.tres" "editor_settings-4.tres"; do
            cat > "$HOME/.config/godot/$f" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
            sed -i 's/^          //' "$HOME/.config/godot/$f"
          done

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.keystore"
            ALIAS="${KEY_ALIAS:-upload}"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - signing with a THROWAWAY key. Fine for testing the APK, NOT for Google Play (see README)."
            ALIAS=upload
            PASS=throwaway-pass
            keytool -genkeypair -v -keystore "$HOME/release.keystore" -alias "$ALIAS" \
              -storepass "$PASS" -keypass "$PASS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Moonpull" >/dev/null 2>&1
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS" >> "$GITHUB_ENV"
          echo "::add-mask::$PASS"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$PASS" >> "$GITHUB_ENV"

          # Every CI run gets a higher versionCode (Google Play requires it).
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" game/export_presets.cfg

      - name: Import project
        run: |
          "$HOME/godot" --headless --path game --import || true
          "$HOME/godot" --headless --path game --import || true

      - name: Export APK and AAB
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          export_one() {
            # $1 = preset name, $2 = output file. Two attempts (first run may trigger a reimport).
            for attempt in 1 2; do
              if "$HOME/godot" --headless --verbose --path game --export-release "$1" "$2" > "export-$attempt.log" 2>&1 && [ -s "$2" ]; then
                echo "Exported $1"; return 0
              fi
              echo "Attempt $attempt for $1 failed"
              "$HOME/godot" --headless --path game --import > /dev/null 2>&1 || true
            done
            {
              echo "## Export of \"$1\" failed"
              echo '```'
              grep -iE "error|warning|missing|requires|not found|invalid" export-2.log | grep -v "tcp:5037" | tail -n 40
              echo '--- last lines ---'
              tail -n 40 export-2.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|missing|requires|not found|invalid" export-2.log | grep -v "tcp:5037" | tail -n 8 | while read -r line; do echo "::error::$line"; done
            return 1
          }
          export_one "Android APK" "$GITHUB_WORKSPACE/out/moonpull.apk"
          export_one "Android AAB" "$GITHUB_WORKSPACE/out/moonpull.aab"
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/moonpull.apk" || { echo "::error::APK was not produced"; exit 1; }
          test -s "$GITHUB_WORKSPACE/out/moonpull.aab" || { echo "::error::AAB was not produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: moonpull-android-${{ github.run_number }}
          path: |
            out/moonpull.apk
            out/moonpull.aab
          if-no-files-found: error

  # Plays 14 levels with a bot (headless) and reports any script error.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Download Godot
        run: |
          set -e
          V="${GODOT_VERSION}"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          mv "Godot_v${V}-stable_linux.x86_64" "$HOME/godot"
          chmod +x "$HOME/godot"

      - name: Autotest (bot plays the game)
        run: |
          "$HOME/godot" --headless --path game --import > /dev/null 2>&1 || true
          "$HOME/godot" --headless --path game --import > /dev/null 2>&1 || true
          set +e
          timeout 900 "$HOME/godot" --headless --path game --fixed-fps 60 -- --autotest > autotest.log 2>&1
          code=$?
          set -e
          errors=$(grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid get|Invalid set|Nonexistent function|AUTOTEST FAILED" autotest.log | grep -v "tcp:5037" | head -n 40 || true)
          {
            echo "## Autotest"
            echo '```'
            grep -E "^AUTOTEST" autotest.log | tail -n 60 || true
            echo '```'
            if [ -n "$errors" ]; then
              echo "### Errors"
              echo '```'
              grep -B2 -A6 -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid get|Invalid set|Nonexistent function|AUTOTEST FAILED" autotest.log | head -n 120
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$errors" ]; then
            echo "$errors" | head -n 10 | while read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if ! grep -q "AUTOTEST PASSED" autotest.log; then
            echo "::error::Autotest did not finish (exit code $code)"
            tail -n 60 autotest.log
            exit 1
          fi
          grep "AUTOTEST PASSED" autotest.log

  # iPhone: unsigned IPA built on GitHub's Mac servers (no Mac / Apple account needed).
  # Install it with a sideloading tool, or add signing later for TestFlight / App Store.
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Download Godot (macOS) + export templates
        run: |
          set -e
          V="${GODOT_VERSION}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
          curl -sSL -o godot.zip "$BASE/Godot_v${V}-stable_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -sSL -o tpl.tpz "$BASE/Godot_v${V}-stable_export_templates.tpz"
          TPL="$HOME/Library/Application Support/Godot/export_templates/${V}.stable"
          mkdir -p "$TPL" /tmp/tpl
          unzip -q tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TPL/"
          rm -f godot.zip tpl.tpz

      - name: Export Xcode project
        run: |
          set -e
          "$GODOT" --headless --path game --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path game --import > /dev/null 2>&1 || true
          mkdir -p "$GITHUB_WORKSPACE/out/ios"
          set +e
          "$GODOT" --headless --verbose --path game --export-release "iOS" "$GITHUB_WORKSPACE/out/ios/moonpull.ipa" > export.log 2>&1
          set -e
          ls -la "$GITHUB_WORKSPACE/out/ios" || true
          if [ ! -d "$GITHUB_WORKSPACE/out/ios/moonpull.xcodeproj" ]; then
            {
              echo "## iOS export failed"
              echo '```'
              grep -iE "error|missing|requires|invalid|not found" export.log | tail -n 40
              echo '--- last lines ---'
              tail -n 40 export.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|missing|requires|invalid" export.log | tail -n 8 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Build unsigned IPA
        run: |
          set -e
          cd out/ios
          SCHEME=$(xcodebuild -list -project moonpull.xcodeproj -json | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild -project moonpull.xcodeproj -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/moonpull.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            archive > xcodebuild.log 2>&1 || {
              { echo "## xcodebuild failed"; echo '```'; grep -E "error:" xcodebuild.log | head -n 30; tail -n 30 xcodebuild.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              grep -E "error:" xcodebuild.log | head -n 8 | while read -r l; do echo "::error::$l"; done
              exit 1; }
          mkdir -p Payload
          cp -R build/moonpull.xcarchive/Products/Applications/*.app Payload/
          zip -qry "$GITHUB_WORKSPACE/out/moonpull-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: moonpull-ios-${{ github.run_number }}
          path: out/moonpull-unsigned.ipa
          if-no-files-found: error

  # Browser version of the game -> GitHub Pages (play-test on any phone/PC, no install).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Download Godot + export templates
        run: |
          set -e
          V="${GODOT_VERSION}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
          wget -q "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          mv "Godot_v${V}-stable_linux.x86_64" "$HOME/godot"
          chmod +x "$HOME/godot"
          wget -q "$BASE/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p /tmp/tpl "$HOME/.local/share/godot/export_templates/${V}.stable"
          unzip -q "Godot_v${V}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"

      - name: Export Web build
        run: |
          set -e
          "$HOME/godot" --headless --path game --import || "$HOME/godot" --headless --path game --editor --quit || true
          mkdir -p "$GITHUB_WORKSPACE/out/web"
          export_one() {
            # $1 = preset name, $2 = output file. Two attempts (first run may trigger a reimport).
            for attempt in 1 2; do
              if "$HOME/godot" --headless --verbose --path game --export-release "$1" "$2" > "export-$attempt.log" 2>&1 && [ -s "$2" ]; then
                echo "Exported $1"; return 0
              fi
              echo "Attempt $attempt for $1 failed"
              "$HOME/godot" --headless --path game --import > /dev/null 2>&1 || true
            done
            {
              echo "## Export of \"$1\" failed"
              echo '```'
              grep -iE "error|warning|missing|requires|not found|invalid" export-2.log | grep -v "tcp:5037" | tail -n 40
              echo '--- last lines ---'
              tail -n 40 export-2.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|missing|requires|not found|invalid" export-2.log | grep -v "tcp:5037" | tail -n 8 | while read -r line; do echo "::error::$line"; done
            return 1
          }
          export_one "Web" "$GITHUB_WORKSPACE/out/web/index.html"
          test -s "$GITHUB_WORKSPACE/out/web/index.html" || { echo "::error::Web build was not produced"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
